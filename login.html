<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - KLU Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">KLU Marketplace</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to your KLU Marketplace account</p>

                <form class="auth-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@klu.edu.in" required>
                        <span class="error-message" id="email-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                        </div>
                        <span class="error-message" id="password-error"></span>
                    </div>

                    <div class="form-remember">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn-primary btn-full">Sign In</button>
                </form>

                <div class="auth-divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn-social google" onclick="loginWithGoogle()">
                        <span>Google</span>
                    </button>
                    <button type="button" class="btn-social facebook" onclick="loginWithFacebook()">
                        <span>Facebook</span>
                    </button>
                </div>

                <p class="auth-link">
                    Don't have an account? <a href="signup.html">Sign Up Here</a>
                </p>
                <p class="auth-link">
                    <a href="#" onclick="forgotPassword()">Forgot Password?</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 KLU Marketplace. All rights reserved.</p>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
