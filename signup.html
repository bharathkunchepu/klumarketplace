<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KLU Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">KLU Marketplace</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html" class="active">Sign Up</a></li>
            </ul>
        </div>
    </nav>

    <!-- Signup Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h1>Join KLU Marketplace</h1>
                <p class="subtitle">Create your account and start trading</p>
                
                <form class="auth-form" id="signupForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">First Name</label>
                            <input type="text" id="firstname" name="firstname" placeholder="John" required>
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastname" name="lastname" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@klu.edu.in" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="9876543210" required>
                    </div>

                    <div class="form-group">
                        <label for="branch">Branch/Department</label>
                        <select id="branch" name="branch" required>
                            <option value="">Select Your Branch</option>
                            <option value="cse">Computer Science & Engineering</option>
                            <option value="ece">Electronics & Communication</option>
                            <option value="me">Mechanical Engineering</option>
                            <option value="civil">Civil Engineering</option>
                            <option value="eee">Electrical Engineering</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                    </div>

                    <div class="form-agree">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
                    </div>

                    <button type="submit" class="btn-primary btn-full">Create Account</button>
                </form>

                <div class="auth-divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button class="btn-social google">
                        <span>Google</span>
                    </button>
                    <button class="btn-social facebook">
                        <span>Facebook</span>
                    </button>
                </div>

                <p class="auth-link">
                    Already have an account? <a href="login.html">Sign In Here</a>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 KLU Marketplace. All rights reserved.</p>
    </footer>
    <script src="auth.js"></script>
</body>
</html>
