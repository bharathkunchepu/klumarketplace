<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile - KLU Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Ensure basic visibility even if CSS doesn't load */
        body {
            background-color: #05050C;
            color: #F5F6FC;
            min-height: 100vh;
        }
        #profile-summary {
            min-height: 200px;
            color: #B8BCD0;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">KLU Marketplace</div>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html" class="active" id="nav-account">
                    <span class="nav-avatar">👤</span>
                    <span class="nav-account-text">Account</span>
                </a></li>
            </ul>
        </div>
    </nav>

    <section class="products" data-animate>
        <h2>Your Account</h2>
        <div class="products-grid" style="max-width:600px; margin:0 auto; grid-template-columns:1fr;">
            <div class="product-card" style="padding:1.5rem;">
                <form id="profile-form" style="display:grid; gap:1.25rem;">
                    <div style="display:flex; flex-direction:column; gap:0.5rem;">
                        <label for="profile-name" style="color:#A29BFE; font-weight:600;">Full Name</label>
                        <input id="profile-name" type="text" placeholder="John Doe" disabled style="padding:0.75rem; border-radius:8px; border:1px solid #A29BFE; background:rgba(0,0,0,0.1); color:#F5F6FC;">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0.5rem;">
                        <label for="profile-email" style="color:#A29BFE; font-weight:600;">Email</label>
                        <input id="profile-email" type="email" placeholder="john.doe@klu.edu.in" disabled style="padding:0.75rem; border-radius:8px; border:1px solid #A29BFE; background:rgba(0,0,0,0.1); color:#F5F6FC;">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0.5rem;">
                        <label for="profile-universityid" style="color:#A29BFE; font-weight:600;">University ID</label>
                        <input id="profile-universityid" type="text" placeholder="123456789" disabled style="padding:0.75rem; border-radius:8px; border:1px solid #A29BFE; background:rgba(0,0,0,0.1); color:#F5F6FC;">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0.5rem;">
                        <label for="profile-branch" style="color:#A29BFE; font-weight:600;">Branch</label>
                        <input id="profile-branch" type="text" placeholder="CSE" disabled style="padding:0.75rem; border-radius:8px; border:1px solid #A29BFE; background:rgba(0,0,0,0.1); color:#F5F6FC;">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0.5rem;">
                        <label for="profile-phone" style="color:#A29BFE; font-weight:600;">Phone</label>
                        <input id="profile-phone" type="text" placeholder="9876543210" disabled style="padding:0.75rem; border-radius:8px; border:1px solid #A29BFE; background:rgba(0,0,0,0.1); color:#F5F6FC;">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0.5rem;">
                        <label for="profile-role" style="color:#A29BFE; font-weight:600;">Role</label>
                        <input id="profile-role" type="text" placeholder="STUDENT" disabled style="padding:0.75rem; border-radius:8px; border:1px solid #A29BFE; background:rgba(0,0,0,0.1); color:#F5F6FC;">
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2025 KLU Marketplace. All rights reserved.</p>
    </footer>

    <noscript>
        <div style="text-align:center; padding:2rem; color:#FF6B6B;">
            <h2>JavaScript Required</h2>
            <p>Please enable JavaScript to view your profile.</p>
        </div>
    </noscript>

    <script>
        // Immediate script - runs as soon as this point is reached
        console.log('=== IMMEDIATE PROFILE SCRIPT STARTING ===');
        (function loadProfileImmediately() {
            try {
                // Wait for container to exist
                function tryLoad() {
                    const container = document.getElementById('profile-summary');
                    console.log('Looking for container, found:', !!container);
                    
                    if (container) {
                        console.log('Container found! Loading user data...');
                        try {
                            const userStr = localStorage.getItem('klu-marketplace-current-user');
                            console.log('User string:', userStr ? 'Found' : 'Not found');
                            
                            if (userStr && userStr.trim() !== 'null' && userStr.trim() !== '') {
                                try {
                                    const user = JSON.parse(userStr);
                                    console.log('User parsed:', user);
                                    
                                    if (user && user.email) {
                                        const name = [user.firstName, user.lastName].filter(Boolean).join(' ') || user.email;
                                        const initials = (user.firstName?.[0] || user.email?.[0] || 'U').toUpperCase();
                                        
                                        container.innerHTML = `
                                            <div style="text-align:center; margin-bottom:2rem;">
                                                <div style="width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg, #A29BFE, #6C5CE7); display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; font-size:2rem; color:white; font-weight:bold;">
                                                    ${initials}
                                                </div>
                                                <h3 style="color:#A29BFE; margin-bottom:0.5rem; font-size:1.5rem;">${name}</h3>
                                                <p style="color:#B8BCD0;">${user.email}</p>
                                            </div>
                                            <div style="border-top:1px solid rgba(162,155,254,0.16); padding-top:1.5rem; margin-top:1.5rem;">
                                                <h4 style="color:#A29BFE; margin-bottom:1rem; font-size:1.1rem;">Account Details</h4>
                                                <div style="display:grid; gap:1rem;">
                                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                                        <strong style="color:#B8BCD0;">Email:</strong>
                                                        <span style="color:#F5F6FC;">${user.email || 'Not provided'}</span>
                                                    </div>
                                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                                        <strong style="color:#B8BCD0;">Full Name:</strong>
                                                        <span style="color:#F5F6FC;">${name || 'Not provided'}</span>
                                                    </div>
                                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                                        <strong style="color:#B8BCD0;">University ID:</strong>
                                                        <span style="color:#F5F6FC;">${user.universityId || 'Not provided'}</span>
                                                    </div>
                                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                                        <strong style="color:#B8BCD0;">Branch:</strong>
                                                        <span style="color:#F5F6FC;">${user.branch || 'Not provided'}</span>
                                                    </div>
                                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                                        <strong style="color:#B8BCD0;">Phone:</strong>
                                                        <span style="color:#F5F6FC;">${user.phone || 'Not provided'}</span>
                                                    </div>
                                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                                        <strong style="color:#B8BCD0;">Role:</strong>
                                                        <span style="color:#F5F6FC;">${user.role || 'STUDENT'}</span>
                                                    </div>
                                                </div>
                                                <p style="text-align:center; color:#B8BCD0; margin-top:1rem; font-size:0.9rem;">Loading additional details from server...</p>
                                            </div>
                                            <div style="border-top:1px solid rgba(162,155,254,0.16); padding-top:1.5rem; margin-top:1.5rem;">
                                                <button onclick="if(window.handleLogout){window.handleLogout();}else{localStorage.removeItem('klu-marketplace-current-user');localStorage.removeItem('klu-marketplace-cart');window.location.href='logout.html';}" style="background:linear-gradient(135deg, #A29BFE, #6C5CE7); color:#05050C; border:none; width:100%; padding:0.75rem; font-size:1rem; cursor:pointer; border-radius:25px; font-weight:600; margin-bottom:0.75rem;">Logout</button>
                                                <a href="index.html" style="background:transparent; border:1px solid rgba(162,155,254,0.16); color:#B8BCD0; text-decoration:none; display:block; text-align:center; padding:0.75rem; border-radius:25px;">Back to Home</a>
                                            </div>
                                        `;
                                        console.log('Profile data displayed with all labels!');
                                        return; // Exit early if user is logged in
                                    }
                                } catch (parseError) {
                                    console.error('Error parsing user data:', parseError);
                                    // Fall through to show "not logged in" message
                                }
                            }
                            
                            // User is not logged in - show login prompt
                            console.log('User not logged in, showing login prompt');
                            container.innerHTML = `
                                <div style="text-align:center; padding:2rem; color:#B8BCD0;">
                                    <h3 style="color:#A29BFE; margin-bottom:1rem;">You are not logged in</h3>
                                    <p style="margin-bottom:1.5rem; color:#B8BCD0;">Please log in to view your profile</p>
                                    <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
                                        <a href="login.html" style="background:linear-gradient(135deg, #A29BFE, #6C5CE7); color:#05050C; text-decoration:none; padding:0.75rem 1.5rem; border-radius:25px; display:inline-block; font-weight:600;">Login</a>
                                        <a href="signup.html" style="background:transparent; border:1px solid rgba(162,155,254,0.16); color:#B8BCD0; text-decoration:none; padding:0.75rem 1.5rem; border-radius:25px; display:inline-block;">Sign Up</a>
                                    </div>
                                </div>
                            `;
                        } catch (e) {
                            console.error('Error loading profile:', e);
                            container.innerHTML = `
                                <div style="text-align:center; padding:2rem; color:#FF6B6B;">
                                    <h3>Error Loading Profile</h3>
                                    <p style="margin:1rem 0;">${e.message || 'Unknown error'}</p>
                                    <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem;">
                                        <a href="login.html" style="background:linear-gradient(135deg, #A29BFE, #6C5CE7); color:#05050C; text-decoration:none; padding:0.75rem 1.5rem; border-radius:25px; display:inline-block; font-weight:600;">Go to Login</a>
                                        <a href="index.html" style="background:transparent; border:1px solid rgba(162,155,254,0.16); color:#B8BCD0; text-decoration:none; padding:0.75rem 1.5rem; border-radius:25px; display:inline-block;">Back to Home</a>
                                    </div>
                                </div>
                            `;
                        }
                    } else {
                        // Container not ready yet, try again
                        setTimeout(tryLoad, 10);
                    }
                }
                tryLoad();
            } catch (e) {
                console.error('Fatal error in immediate script:', e);
                // Even if script fails, the fallback HTML in the container should show
            }
        })();
    </script>
    <script src="auth.js"></script>
    <script>
        // handleLogout is now defined in auth.js, but we can override it here if needed
        // Ensure it's available globally
        if (!window.handleLogout) {
            window.handleLogout = function() {
                if (confirm('Are you sure you want to logout?')) {
                    // Clear localStorage
                    localStorage.removeItem('klu-marketplace-current-user');
                    localStorage.removeItem('klu-marketplace-cart');
                    
                    // Redirect to logout page
                    window.location.href = 'logout.html';
                }
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const container = document.getElementById('profile-summary');
                
                // Safety check
                if (!container) {
                    console.error('Profile container not found!');
                    document.body.innerHTML = '<div style="padding:2rem; text-align:center; color:#FF6B6B;"><h1>Error: Page structure issue</h1><p>Please refresh the page.</p></div>';
                    return;
                }
            
            const API_BASE = window.API_BASE || 'http://localhost:8080/api';
            
            // Check if user is logged in
            let user = null;
            try {
                user = window.kluAuth?.getCurrentUser();
            } catch (e) {
                console.error('Error getting user:', e);
            }
            
            console.log('Current user from localStorage:', user);

            if (!user || !user.email) {
                container.innerHTML = `
                    <div style="text-align:center; padding:2rem; color:#B8BCD0;">
                        <h3 style="color:#A29BFE; margin-bottom:1rem;">You are not logged in</h3>
                        <p style="margin-bottom:1.5rem; color:#B8BCD0;">Please log in to view your profile</p>
                        <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
                            <a href="login.html" style="background:linear-gradient(135deg, #A29BFE, #6C5CE7); color:#05050C; text-decoration:none; padding:0.75rem 1.5rem; border-radius:25px; display:inline-block; font-weight:600;">Login</a>
                            <a href="signup.html" style="background:transparent; border:1px solid rgba(162,155,254,0.16); color:#B8BCD0; text-decoration:none; padding:0.75rem 1.5rem; border-radius:25px; display:inline-block;">Sign Up</a>
                        </div>
                    </div>
                `;
                return;
            }

            // Immediately show user data from localStorage as a fallback
            const immediateName = [user.firstName, user.lastName].filter(Boolean).join(' ') || user.email;
            const immediateInitials = (user.firstName?.[0] || user.email?.[0] || 'U').toUpperCase();
            
            // Show immediate fallback content
            container.innerHTML = `
                <div style="text-align:center; margin-bottom:2rem;">
                    <div style="width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg, #A29BFE, #6C5CE7); display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; font-size:2rem; color:white; font-weight:bold;">
                        ${immediateInitials}
                    </div>
                    <h3 style="color:#A29BFE; margin-bottom:0.5rem; font-size:1.5rem;">${immediateName}</h3>
                    <p style="color:#B8BCD0;">${user.email}</p>
                </div>
                <div style="border-top:1px solid rgba(162,155,254,0.16); padding-top:1.5rem; margin-top:1.5rem;">
                    <h4 style="color:#A29BFE; margin-bottom:1rem; font-size:1.1rem;">Account Details</h4>
                    <div style="display:grid; gap:1rem;">
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                            <strong style="color:#B8BCD0;">Email:</strong>
                            <span style="color:#F5F6FC;">${user.email || 'Not provided'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                            <strong style="color:#B8BCD0;">Full Name:</strong>
                            <span style="color:#F5F6FC;">${immediateName || 'Not provided'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                            <strong style="color:#B8BCD0;">University ID:</strong>
                            <span style="color:#F5F6FC;">${user.universityId || 'Not provided'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                            <strong style="color:#B8BCD0;">Branch:</strong>
                            <span style="color:#F5F6FC;">${user.branch || 'Not provided'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                            <strong style="color:#B8BCD0;">Phone:</strong>
                            <span style="color:#F5F6FC;">${user.phone || 'Not provided'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                            <strong style="color:#B8BCD0;">Role:</strong>
                            <span style="color:#F5F6FC;">${user.role || 'STUDENT'}</span>
                        </div>
                    </div>
                    <p style="text-align:center; color:#B8BCD0; margin-top:1rem; font-size:0.9rem;">Loading additional details from server...</p>
                </div>
                <div style="border-top:1px solid rgba(162,155,254,0.16); padding-top:1.5rem; margin-top:1.5rem;">
                    <button onclick="handleLogout()" style="background:linear-gradient(135deg, #A29BFE, #6C5CE7); color:#05050C; border:none; width:100%; padding:0.75rem; font-size:1rem; cursor:pointer; border-radius:25px; font-weight:600; margin-bottom:0.75rem;">Logout</button>
                    <a href="index.html" style="background:transparent; border:1px solid rgba(162,155,254,0.16); color:#B8BCD0; text-decoration:none; display:block; text-align:center; padding:0.75rem; border-radius:25px;">Back to Home</a>
                </div>
            `;
            
            // Add event listener to logout button immediately
            setTimeout(() => {
                const logoutBtn = container.querySelector('button[onclick*="handleLogout"]');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        if (window.handleLogout) window.handleLogout();
                    });
                }
            }, 50);

            // Fetch user details from backend
            const profileUrl = `${API_BASE}/profile?email=${encodeURIComponent(user.email)}`;
            console.log('Fetching profile from:', profileUrl);

            fetch(profileUrl)
                .then(async (response) => {
                    console.log('Profile response status:', response.status);
                    const data = await response.json().catch(() => {
                        console.error('Failed to parse JSON response');
                        return {};
                    });
                    console.log('Profile data received:', data);
                    try {
                        console.log('Profile data keys:', Object.keys(data || {}));
                        console.log('Profile data values:', JSON.stringify(data || {}));
                    } catch (e) {
                        console.error('Error logging data:', e);
                    }
                    console.log('Response OK:', response.ok);
                    console.log('About to check if response.ok...');

                    if (!response.ok) {
                        console.log('Response not OK, showing error fallback');
                        // Show error but also show user data from localStorage as fallback
                        const fallbackName = [user.firstName, user.lastName].filter(Boolean).join(' ') || user.email;
                        const fallbackInitials = (user.firstName?.[0] || user.email?.[0] || 'U').toUpperCase();
                        
                        container.innerHTML = `
                            <div style="text-align:center; margin-bottom:2rem;">
                                <div style="width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg, #A29BFE, #6C5CE7); display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; font-size:2rem; color:white; font-weight:bold;">
                                    ${fallbackInitials}
                                </div>
                                <h3 style="color:#A29BFE; margin-bottom:0.5rem;">${fallbackName}</h3>
                                <p style="color:#B8BCD0;">${user.email}</p>
                            </div>
                            
                            <div style="border-top:1px solid rgba(162,155,254,0.16); padding-top:1.5rem; margin-top:1.5rem;">
                                <h4 style="color:#A29BFE; margin-bottom:1rem; font-size:1.1rem;">Account Details</h4>
                                <div style="display:grid; gap:1rem;">
                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                        <strong style="color:#B8BCD0;">Email:</strong>
                                        <span style="color:#F5F6FC;">${user.email || 'Not provided'}</span>
                                    </div>
                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                        <strong style="color:#B8BCD0;">Full Name:</strong>
                                        <span style="color:#F5F6FC;">${fallbackName || 'Not provided'}</span>
                                    </div>
                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                        <strong style="color:#B8BCD0;">University ID:</strong>
                                        <span style="color:#F5F6FC;">${user.universityId || 'Not provided'}</span>
                                    </div>
                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                        <strong style="color:#B8BCD0;">Branch:</strong>
                                        <span style="color:#F5F6FC;">${user.branch || 'Not provided'}</span>
                                    </div>
                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                        <strong style="color:#B8BCD0;">Phone:</strong>
                                        <span style="color:#F5F6FC;">${user.phone || 'Not provided'}</span>
                                    </div>
                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:rgba(0,0,0,0.1); border-radius:8px;">
                                        <strong style="color:#B8BCD0;">Role:</strong>
                                        <span style="color:#F5F6FC;">${user.role || 'STUDENT'}</span>
                                    </div>
                                </div>
                                <p style="color:#FF6B6B; margin-top:1rem; text-align:center; font-size:0.9rem;">Note: Could not load full details from server. (${data.message || 'Error'})</p>
                            </div>
                            
                            <div style="border-top:1px solid rgba(162,155,254,0.16); padding-top:1.5rem; margin-top:1.5rem;">
                                <button onclick="handleLogout()" style="background:linear-gradient(135deg, #A29BFE, #6C5CE7); color:#05050C; border:none; width:100%; padding:0.75rem; border-radius:25px; font-weight:600; cursor:pointer; margin-bottom:0.75rem;">Logout</button>
                                <a href="index.html" style="background:transparent; border:1px solid rgba(162,155,254,0.16); color:#B8BCD0; text-decoration:none; display:block; text-align:center; padding:0.75rem; border-radius:25px;">Back to Home</a>
                            </div>
                        `;
                        // Add event listener to logout button
                        setTimeout(() => {
                            const logoutBtn = container.querySelector('button[onclick*="handleLogout"]');
                            if (logoutBtn) {
                                logoutBtn.addEventListener('click', function(e) {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    if (window.handleLogout) window.handleLogout();
                                });
                            }
                        }, 100);
                        return;
                    }

                    // Success - display full user details
                    console.log('=== SUCCESS PATH EXECUTING ===');
                    console.log('Response OK, rendering profile data');
                    console.log('data object:', data);
                    console.log('data.firstName:', data.firstName, 'data.lastName:', data.lastName);
                    console.log('data type:', typeof data);
                    
                    const name = [data.firstName || user.firstName, data.lastName || user.lastName].filter(Boolean).join(' ') || user.firstName || user.email;
