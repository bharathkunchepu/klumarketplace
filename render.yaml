services:
  - type: web
    name: klu-marketplace-frontend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: master
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
        value: https://umarketing-system-backend.onrender.com/api/v1
    healthCheckPath: /
    autoDeploy: true

